{% extends "base.html" %}

{% block title %}Iniciar sesión — CRM BGH{% endblock %}

{% block public_content %}
<div class="login-page">
    <div class="login-card">
        <div class="login-brand">
            <div class="login-brand-icon">B</div>
            <h1 class="login-title">CRM BGH</h1>
            <p class="login-subtitle">Gestión de Casos de Soporte</p>
        </div>

        <form method="POST" action="{{ url_for('auth.login') }}">
            <div class="form-group">
                <label class="form-label" for="username">Usuario</label>
                <input type="text" id="username" name="username" class="form-input"
                       placeholder="Tu nombre de usuario" required autofocus>
            </div>

            <div class="form-group">
                <label class="form-label" for="password">Contraseña</label>
                <input type="password" id="password" name="password" class="form-input"
                       placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn btn-primary login-btn">
                Iniciar Sesión
            </button>
        </form>
    </div>
</div>
{% endblock %}
